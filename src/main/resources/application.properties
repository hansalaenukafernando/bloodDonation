spring.application.name=bloodDonation

spring.datasource.url=jdbc:mysql://localhost:3306/blood_donation_db?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=Enuka#4851
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

## JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

## ---------------------------------------------------------------
## Email (Gmail SMTP) - used for the "Forgot Password" emails
## The App Password itself lives in mail-secret.properties (NOT committed to git)
## ---------------------------------------------------------------
spring.config.import=optional:classpath:mail-secret.properties

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=et.website.message@gmail.com
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=8000
spring.mail.properties.mail.smtp.timeout=8000
spring.mail.properties.mail.smtp.writetimeout=8000

## Sender display name shown in the inbox
app.mail.from-name=LifeStream Blood Donation

## Base URL used to build the reset link inside the email.
## Change this to your real domain when you deploy (e.g. https://lifestream.lk)
app.base-url=http://localhost:8080
